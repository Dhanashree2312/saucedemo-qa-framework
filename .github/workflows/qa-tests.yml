
name: SauceDemo QA Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: saucedemo-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-qa-suite:
    name: Complete Web API and Mobile QA Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      TESTDATA_SOURCE: s3
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}

    steps:

      # ---------------- CHECKOUT ----------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- JAVA ----------------

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ---------------- NODE ----------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---------------- PLAYWRIGHT ----------------

      - name: Install Playwright browsers and dependencies
        run: |
          mvn -B exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium firefox webkit"

      # ---------------- APPIUM ----------------

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@3.9.0
          appium --version

          appium driver install uiautomator2@8.7.3
          appium driver list --installed

      # ---------------- AWS ----------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ---------------- RUN COMPLETE FRAMEWORK ----------------

      - name: Run complete QA framework with reporting and S3 upload
        id: qa-pipeline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          cores: 2
          ram-size: 2048M
          heap-size: 512M

          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none

          disable-animations: true

          script: |
            set -euo pipefail

            echo "Checking Android emulator..."
            adb devices -l
            adb wait-for-device

            for i in {1..120}; do
              BOOT_STATUS=$(adb shell getprop sys.boot_completed | tr -d '\r')
              if [ "$BOOT_STATUS" = "1" ]; then
                break
              fi
              sleep 2
            done

            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            echo "Android emulator is ready"

            echo "Starting Appium server..."
            nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 < /dev/null &

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:4723/status; then
                break
              fi
              sleep 2
            done

            curl -fsS http://127.0.0.1:4723/status

            echo "Starting complete Maven QA pipeline..."

            mvn -B clean verify \
              "-Dtestdata.source=${TESTDATA_SOURCE}" \
              "-Denv=qa" \
              "-Dexecution.id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      # ---------------- GITHUB ARTIFACTS ----------------

      - name: Upload execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-qa-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/reports/
            target/allure-results/
            target/surefire-reports/
            logs/automation.log
            appium.log
          if-no-files-found: warn
          retention-days: 7

      # ---------------- EXECUTION SUMMARY ----------------

      - name: Final execution summary
        if: always()
        run: |
          echo "Complete QA pipeline: ${{ steps.qa-pipeline.outcome }}"
          echo "Execution ID: $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          if [[ "${{ steps.qa-pipeline.outcome }}" != "success" ]]; then
            echo "QA pipeline failed. Check Maven logs and uploaded artifacts."
            exit 1
          fi

          echo "Complete QA pipeline succeeded."
