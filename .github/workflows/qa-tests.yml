
name: SauceDemo QA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    name: Run UI Automation Tests
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Playwright browser dependencies
        run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Prepare log directory
        run: mkdir -p logs

      # TEMPORARY DIAGNOSTIC: Inspect GitHub OIDC identity claims
      - name: Inspect GitHub OIDC claims
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString('utf8')
            );

            core.info(`OIDC issuer: ${claims.iss}`);
            core.info(`OIDC audience: ${JSON.stringify(claims.aud)}`);
            core.info(`OIDC subject: ${claims.sub}`);

      # AWS authentication only for non-PR runs
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      # Pull requests use local test data
      - name: Run UI tests with local test data
        if: github.event_name == 'pull_request'
        run: mvn clean test

      # Main branch and manual runs use S3 test data
      - name: Run UI tests with S3 test data
        if: github.event_name != 'pull_request'
        run: mvn clean test "-Dtestdata.source=s3"

      - name: Generate UI Allure HTML report
        if: always()
        run: mvn allure:report

      # Upload HTML report and raw Allure results to S3
      - name: Upload UI reports to S3
        if: always() && github.event_name != 'pull_request'
        run: |
          aws s3 sync target/site/allure-maven-plugin/ \
            s3://${{ vars.S3_BUCKET }}/saucedemo-reports/${{ github.run_id }}/${{ github.run_attempt }}/ui/html/ \
            --no-progress

          aws s3 sync target/allure-results/ \
            s3://${{ vars.S3_BUCKET }}/saucedemo-reports/${{ github.run_id }}/${{ github.run_attempt }}/ui/allure-results/ \
            --no-progress

      - name: Upload UI test reports and logs to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-ui-artifacts-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
            logs/automation.log
          if-no-files-found: warn
          retention-days: 14

  api-tests:
    name: Run API Automation Tests
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # TEMPORARY DIAGNOSTIC: Inspect GitHub OIDC identity claims
      - name: Inspect GitHub OIDC claims
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString('utf8')
            );

            core.info(`OIDC issuer: ${claims.iss}`);
            core.info(`OIDC audience: ${JSON.stringify(claims.aud)}`);
            core.info(`OIDC subject: ${claims.sub}`);

      - name: Run API TestNG suite
        run: mvn clean test "-Dsurefire.suiteXmlFiles=testng-api.xml"

      - name: Generate API Allure HTML report
        if: always()
        run: mvn allure:report

      # AWS authentication only for non-PR runs
      - name: Configure AWS credentials
        if: always() && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload API reports to S3
        if: always() && github.event_name != 'pull_request'
        run: |
          aws s3 sync target/site/allure-maven-plugin/ \
            s3://${{ vars.S3_BUCKET }}/saucedemo-reports/${{ github.run_id }}/${{ github.run_attempt }}/api/html/ \
            --no-progress

          aws s3 sync target/allure-results/ \
            s3://${{ vars.S3_BUCKET }}/saucedemo-reports/${{ github.run_id }}/${{ github.run_attempt }}/api/allure-results/ \
            --no-progress

      - name: Upload API test reports to GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-api-artifacts-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 14