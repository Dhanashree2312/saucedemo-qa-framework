name: SauceDemo QA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ui-tests:
    name: Run UI Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Playwright browser dependencies
        run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run TestNG suite
        run: mvn clean test


      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-test-artifacts
          path: |
            target/surefire-reports/
            target/allure-results/
            logs/automation.log
          if-no-files-found: warn
          retention-days: 14
