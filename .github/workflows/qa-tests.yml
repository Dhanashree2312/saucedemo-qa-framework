
name: SauceDemo QA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: saucedemo-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-qa-suite:
    name: Complete Web API and Mobile QA Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      TESTDATA_SOURCE: ${{ github.event_name == 'pull_request' && 'local' || 's3' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright browsers and dependencies
        run: |
          mvn -B exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium firefox webkit"

      - name: Install Appium and UiAutomator2
        run: |
          npm install --global appium@3.9.0
          appium driver install uiautomator2
          appium --version
          appium driver list --installed

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        if: github.event_name != 'pull_request'
        run: |
          aws sts get-caller-identity

      - name: Run complete QA suite on Android emulator
        id: run-tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          disable-animations: true

          # IMPORTANT:
          # The action executes script lines separately.
          # Keep EVERY command below on one line.
          script: |
            echo "Checking Android emulator connection"
            adb devices -l
            adb wait-for-device
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            echo "Android emulator is ready"
            adb devices -l
            echo "Starting Appium server"
            nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 < /dev/null &
            echo "Waiting for Appium server"
            curl --retry 30 --retry-delay 2 --retry-connrefused --max-time 5 -fsS http://127.0.0.1:4723/status
            echo "Appium server is ready"
            echo "Starting complete QA test suite"
            echo "Test data source: $TESTDATA_SOURCE"
            mvn -B clean test "-Dtestdata.source=$TESTDATA_SOURCE"

      - name: Generate Allure HTML report
        id: allure-report
        if: always()
        run: |
          mvn -B -q allure:report

      - name: Build uploader runtime classpath
        id: uploader-classpath
        if: always() && github.event_name != 'pull_request'
        run: |
          mvn -B -q -DskipTests test-compile dependency:build-classpath -Dmdep.outputFile=target/runtime-classpath.txt

      - name: Upload execution artifacts to S3
        if: always() && github.event_name != 'pull_request' && steps.uploader-classpath.outcome == 'success'
        run: |
          TEST_STATUS="${{ steps.run-tests.outcome == 'success' && '0' || '1' }}"

          java -cp "target/test-classes:target/classes:$(cat target/runtime-classpath.txt)" \
            com.qa.tests.reporting.CloudArtifactUploader \
            "${{ github.run_id }}-${{ github.run_attempt }}" \
            "$TEST_STATUS"

      - name: Upload GitHub execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-qa-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/allure-results/
            target/site/allure-maven-plugin/
            target/surefire-reports/
            appium.log
          if-no-files-found: warn
          retention-days: 7

      - name: Validate final execution status
        if: always()
        run: |
          echo "Test execution status: ${{ steps.run-tests.outcome }}"
          echo "Allure report status: ${{ steps.allure-report.outcome }}"

          if [[ "${{ steps.run-tests.outcome }}" != "success" ]]; then
            echo "QA test execution failed."
            exit 1
          fi

          if [[ "${{ steps.allure-report.outcome }}" != "success" ]]; then
            echo "Allure report generation failed."
            exit 1
          fi

          echo "Complete QA execution and Allure report generation succeeded."
